<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Finance Tracker with Analytics</title>
    <script>
      (function() {
        function sendStreamlit(type, data) {
          try {
            var msg = Object.assign({
              isStreamlitMessage: true,
              type: type,
              apiVersion: 1
            }, data || {});
            window.parent.postMessage(msg, '*');
          } catch(e) {}
        }

        function notifyReady() {
          sendStreamlit('streamlit:componentReady');
          var h = Math.max(
            document.documentElement ? document.documentElement.scrollHeight : 0,
            document.body ? document.body.scrollHeight : 0,
            1000
          );
          sendStreamlit('streamlit:setFrameHeight', { height: h });
        }

        // Notify immediately
        notifyReady();

        // Notify on DOM ready
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', notifyReady);
        }

        // Notify on window load
        window.addEventListener('load', notifyReady);

        // Keep-alive height synchronization
        setInterval(notifyReady, 800);

        // Respond to Streamlit render calls
        window.addEventListener('message', function(event) {
          if (event.data && event.data.isStreamlitMessage && event.data.type === 'streamlit:render') {
            notifyReady();
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
